[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/var/run/nginx/supervisord.pid


[program:php-fpm]
command=php-fpm -F
priority=10

autostart=true
autorestart=true
startretries=3

stopsignal=QUIT
stopwaitsecs=75
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:nginx]
command=nginx -g "daemon off;"
priority=20

autostart=true
autorestart=true
startretries=3

stopsignal=QUIT
stopwaitsecs=75
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:required-process-exit]
command=python3 /usr/local/bin/service-supervisor-events.py
events=PROCESS_STATE_FATAL
priority=1
buffer_size=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
